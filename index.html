<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margarida Depp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('photo.jpg') center center / cover no-repeat;
            filter: brightness(0.75);
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 85%;
        }
        h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 16px;
            margin-bottom: 30px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }
        .btn {
            display: block;
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .btn:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="content">
        <h1>Margarida Depp</h1>
        <p>chicago nights. don't overthink it.</p>
        <a href="https://t.me/+5bXgKcz4GCE1ZWEx" class="btn">Margarida tap here</a>
    </div>

</body>
</html>
